name: apply-patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack patch
        run: |
          base64 -d patch.b64 > /tmp/p.tgz
          tar -xzf /tmp/p.tgz -C /tmp
          cp -r /tmp/app/. app/
          rm -f patch.b64 .github/workflows/apply.yml .github/workflows/t.yml

      - name: JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        run: |
          curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/g.zip -d "$HOME/gh"
          echo "$HOME/gh/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "History records + 5 min minimum target"
          git push
